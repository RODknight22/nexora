[package]
name = "nexora"
version = "0.1.0"
description = "NEXØRA — Nueva generación de optimización"
authors = ["Rodknight"]
edition = "2021"

[lib]
name = "nexora_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
