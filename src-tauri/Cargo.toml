[package]
name = "nexora"
version = "0.1.0"
description = "NEXØRA — Nueva generación de optimización"
authors = ["Rodknight"]
edition = "2021"

[lib]
name = "nexora_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
